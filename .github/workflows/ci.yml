name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.find.outputs.changed }}
      python: ${{ steps.find.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all=$(ls -d tools/*/ guides/*/ web/*/ hpc/*/ | sed 's#/$##')
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null \
             || git diff --name-only "$BASE" HEAD | grep -q '^\.github/'; then
            changed="$all"
          else
            changed=$(git diff --name-only "$BASE" HEAD | awk -F/ 'NF>2{print $1"/"$2}' | sort -u)
          fi
          python=$(for d in $changed; do if [ -f "$d/pyproject.toml" ]; then echo "$d"; fi; done)
          echo "changed=$(printf '%s\n' $changed | jq -Rcs 'split("\n")|map(select(length>0))')" >> "$GITHUB_OUTPUT"
          echo "python=$(printf '%s\n' $python | jq -Rcs 'split("\n")|map(select(length>0))')" >> "$GITHUB_OUTPUT"

  python:
    needs: detect
    if: needs.detect.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.python) }}
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: ruff check src tests
      - run: python -m compileall -q src tests

  guide-assets:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: guides/failure-gallery
            cmd: python scripts/verify_assets.py
          - dir: guides/metric-cards
            cmd: python scripts/verify_assets.py
          - dir: guides/p3-survival-guide
            cmd: python scripts/verify_assets.py
          - dir: guides/visual-cheatsheets
            cmd: python scripts/verify_assets.py
          - dir: guides/multilingual-starter
            cmd: python scripts/check_sync.py
    steps:
      - uses: actions/checkout@v4
        if: contains(fromJSON(needs.detect.outputs.changed), matrix.dir)
      - uses: actions/setup-python@v5
        if: contains(fromJSON(needs.detect.outputs.changed), matrix.dir)
        with:
          python-version: "3.12"
      - if: contains(fromJSON(needs.detect.outputs.changed), matrix.dir)
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmd }}

  reliability-lab:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.changed), 'guides/reliability-lab')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guides/reliability-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/experiments.py --all --out /tmp/results.json

  reprobox:
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.changed), 'tools/reprobox')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/reprobox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest -q
      - run: docker build -t vec-reprobox:test .
      - run: docker run --rm vec-reprobox:test python scripts/smoke_test.py
