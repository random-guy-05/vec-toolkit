<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
<rect width="1240" height="1754" fill="#0B1020"/>
<text x="70" y="70" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#57D3C8" text-anchor="start">VIRTUAL EMBRYO CHALLENGE</text>
<text x="70" y="145" font-family="DejaVu Sans" font-size="56" font-weight="700" fill="#F7F8FA" text-anchor="start">P3 SURVIVAL GUIDE</text>
<text x="70" y="205" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#B9C2D0" text-anchor="start">20 October 2026: validation answers become training</text>
<text x="70" y="243" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#B9C2D0" text-anchor="start">data; hidden test boards become the ranking target.</text>
<rect x="70" y="330" width="1100" height="250" rx="30" fill="#141B2D"/>
<text x="110" y="395" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#F3C969" text-anchor="start">THE ONE-SENTENCE CHANGE</text>
<text x="110" y="455" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#F7F8FA" text-anchor="start">In P2 you tune against hidden validation scores. In P3 those</text>
<text x="110" y="499" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#F7F8FA" text-anchor="start">validation answers are released for retraining, while test</text>
<text x="110" y="543" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#F7F8FA" text-anchor="start">ground truth stays hidden and each board gives you only two</text>
<text x="110" y="587" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#F7F8FA" text-anchor="start">official shots.</text>
<circle cx="120" cy="690" r="32" fill="#82D982"/>
<text x="120" y="700" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#0B1020" text-anchor="middle">1</text>
<text x="180" y="684" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#F7F8FA" text-anchor="start">Retrain</text>
<text x="180" y="724" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#B9C2D0" text-anchor="start">validation ground truth joins your usable</text>
<text x="180" y="756" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#B9C2D0" text-anchor="start">training information</text>
<circle cx="120" cy="870" r="32" fill="#6CB6FF"/>
<text x="120" y="880" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#0B1020" text-anchor="middle">2</text>
<text x="180" y="864" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#F7F8FA" text-anchor="start">Predict</text>
<text x="180" y="904" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#B9C2D0" text-anchor="start">generate final hidden-test predictions without</text>
<text x="180" y="936" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#B9C2D0" text-anchor="start">biological feedback</text>
<circle cx="120" cy="1050" r="32" fill="#F3C969"/>
<text x="120" y="1060" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#0B1020" text-anchor="middle">3</text>
<text x="180" y="1044" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#F7F8FA" text-anchor="start">Freeze</text>
<text x="180" y="1084" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#B9C2D0" text-anchor="start">hash + lock the exact artifact you intend to</text>
<text x="180" y="1116" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#B9C2D0" text-anchor="start">upload</text>
<circle cx="120" cy="1230" r="32" fill="#EC7CA7"/>
<text x="120" y="1240" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#0B1020" text-anchor="middle">4</text>
<text x="180" y="1224" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#F7F8FA" text-anchor="start">Submit</text>
<text x="180" y="1264" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#B9C2D0" text-anchor="start">up to 2 official submissions per board for the</text>
<text x="180" y="1296" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#B9C2D0" text-anchor="start">whole phase</text>
<rect x="70" y="1450" width="1100" height="170" rx="26" fill="#1B2440"/>
<text x="110" y="1505" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#57D3C8" text-anchor="start">DATES</text>
<text x="110" y="1555" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#F7F8FA" text-anchor="start">20 Oct  P3 opens</text>
<text x="460" y="1555" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#F7F8FA" text-anchor="start">2 Dec  final submissions due</text>
<text x="850" y="1555" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#F7F8FA" text-anchor="start">4 Dec  evaluation starts</text>
<text x="110" y="1595" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#F7F8FA" text-anchor="start">11 Dec  winners announced at NeurIPS</text>
<line x1="70" y1="1700" x2="1170" y2="1700" stroke="#2B3550" stroke-width="2" stroke-linecap="round"/>
<text x="70" y="1732" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#B9C2D0" text-anchor="start">virtualembryo.ai/challenge - source snapshot 2026-10-05</text>
<text x="1170" y="1732" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#B9C2D0" text-anchor="end">Community visual resource - MIT</text>
</svg>