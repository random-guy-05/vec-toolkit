<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
<rect width="1240" height="1754" fill="#0B1020"/>
<text x="70" y="70" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#57D3C8" text-anchor="start">P3 SURVIVAL GUIDE</text>
<text x="70" y="145" font-family="DejaVu Sans" font-size="44" font-weight="700" fill="#F7F8FA" text-anchor="start">The scarce-resource checklist</text>
<text x="70" y="200" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#B9C2D0" text-anchor="start">P3 is not the time to discover that you uploaded the</text>
<text x="70" y="234" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#B9C2D0" text-anchor="start">wrong artifact.</text>
<rect x="70" y="320" width="1100" height="165" rx="22" fill="#141B2D"/>
<circle cx="120" cy="402" r="15" fill="#82D982"/>
<text x="160" y="387" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#F7F8FA" text-anchor="start">Format check</text>
<text x="160" y="428" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#B9C2D0" text-anchor="start">Unlimited. Use it aggressively before any official attempt.</text>
<rect x="70" y="505" width="1100" height="165" rx="22" fill="#141B2D"/>
<circle cx="120" cy="587" r="15" fill="#EC7CA7"/>
<text x="160" y="572" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#F7F8FA" text-anchor="start">Official submissions</text>
<text x="160" y="613" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#B9C2D0" text-anchor="start">2 per board for the whole phase - not per day.</text>
<rect x="70" y="690" width="1100" height="165" rx="22" fill="#141B2D"/>
<circle cx="120" cy="772" r="15" fill="#F28B82"/>
<text x="160" y="757" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#F7F8FA" text-anchor="start">Withdrawal</text>
<text x="160" y="798" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#B9C2D0" text-anchor="start">Official submissions cannot be withdrawn after they are made.</text>
<rect x="70" y="875" width="1100" height="165" rx="22" fill="#141B2D"/>
<circle cx="120" cy="957" r="15" fill="#6CB6FF"/>
<text x="160" y="942" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#F7F8FA" text-anchor="start">Ranking</text>
<text x="160" y="983" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#B9C2D0" text-anchor="start">The board keeps your best result; the second shot helps or does</text>
<text x="160" y="1013" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#B9C2D0" text-anchor="start">not.</text>
<rect x="70" y="1060" width="1100" height="165" rx="22" fill="#141B2D"/>
<circle cx="120" cy="1142" r="15" fill="#F3C969"/>
<text x="160" y="1127" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#F7F8FA" text-anchor="start">File cap</text>
<text x="160" y="1168" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#B9C2D0" text-anchor="start">A single prediction file may not exceed 1200 MB.</text>
<rect x="70" y="1245" width="1100" height="165" rx="22" fill="#141B2D"/>
<circle cx="120" cy="1327" r="15" fill="#9E8CFF"/>
<text x="160" y="1312" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#F7F8FA" text-anchor="start">Agent teams</text>
<text x="160" y="1353" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#B9C2D0" text-anchor="start">Evidence requirements still apply before scoring.</text>
<line x1="70" y1="1700" x2="1170" y2="1700" stroke="#2B3550" stroke-width="2" stroke-linecap="round"/>
<text x="70" y="1732" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#B9C2D0" text-anchor="start">virtualembryo.ai/challenge - source snapshot 2026-10-05</text>
<text x="1170" y="1732" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#B9C2D0" text-anchor="end">Community visual resource - MIT</text>
</svg>